services:
  # Access (no auth — tailnet/LAN only, do NOT publish to the internet):
  #   Tailscale: http://100.101.3.115:8211  (this host = axiom)
  #   LAN:       http://192.168.1.173:8211
  # From any other tailnet/LAN device, verify with:
  #   curl http://100.101.3.115:8211/health
  # If that times out, host ufw is filtering inbound — allow it once:
  #   sudo ufw allow 8211/tcp
  # HTTPS alternative (needs sudo once): sudo tailscale set --operator=$USER,
  # then: tailscale serve --bg http://127.0.0.1:8211
  intel-forensics:
    build: .
    container_name: intel-forensics
    hostname: intel-forensics
    restart: unless-stopped
    ports:
      - "8211:8211"
    environment:
      # Reach host-side fox-services + Ollama from inside the container.
      - FOX_URL=http://host.docker.internal:8210
      - OLLAMA_URL=http://host.docker.internal:11434
      - IF_MODEL=${IF_MODEL:-qwen3.8:27b}
      - FOX_SERVICES_DB=/fox-data/fox_services.db
    volumes:
      # Fox telemetry DB, read-only: we snapshot-copy it, never write.
      - /home/fox/codebase/fox-services/data:/fox-data:ro
      # Persist our own evidence + reconstructions on the host repo.
      - ./evidence:/app/evidence
      - ./reconstructions:/app/reconstructions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8211/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Agent-swarm workers (P7.32): one container per role, NVIDIA passthrough.
  # Start with: SWARM_ROLE=profiler docker compose --profile swarm up -d
  # Scale with:  docker compose --profile swarm up -d --scale swarm-worker=2
  # Roles: profiler | critic | gather | security | any ($SWARM_ROLE).
  # Gatherers read fox telemetry (fox-data:ro); all other roles are confined
  # to ./evidence (they only ever see what gatherers collected). GPU count 1
  # per worker spreads replicas across both RTX 5080s; pin with device_ids.
  swarm-worker:
    profiles: [swarm]
    build: .
    environment:
      - FOX_URL=http://host.docker.internal:8210
      - OLLAMA_URL=http://host.docker.internal:11434
      - IF_MODEL=${IF_MODEL:-qwen3.8:27b}
      - SWARM_ROLE=${SWARM_ROLE:-profiler}
    volumes:
      - ./evidence:/app/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["python", "cli.py", "swarm-worker"]
    restart: unless-stopped

  # Gatherer role: same worker, plus the read-only fox DB (P7.32).
  # Start with: SWARM_ROLE=gather docker compose --profile swarm up -d swarm-gather
  swarm-gather:
    profiles: [swarm]
    build: .
    environment:
      - FOX_URL=http://host.docker.internal:8210
      - OLLAMA_URL=http://host.docker.internal:11434
      - IF_MODEL=${IF_MODEL:-qwen3.8:27b}
      - SWARM_ROLE=gather
      - FOX_SERVICES_DB=/fox-data/fox_services.db
    volumes:
      - /home/fox/codebase/fox-services/data:/fox-data:ro
      - ./evidence:/app/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "cli.py", "swarm-worker", "--role", "gather"]
    restart: unless-stopped

  # Optional PORT-LEVEL capture (raw packets, not just fox APIs).
  # Off by default: start with `docker compose --profile pcap up -d pcap-tap`.
  # Needs no host root beyond docker access. WARNING: pcaps contain RAW
  # prompts (unmasked, unlike the fox DB) — treat ./evidence/pcaps as
  # sensitive, never commit, never ship off-host.
  pcap-tap:
    profiles: [pcap]
    image: nicolaka/netshoot:latest
    container_name: intel-pcap-tap
    network_mode: host
    cap_add:
      - NET_RAW
    volumes:
      - ./evidence/pcaps:/pcaps:rw
    command: ["tcpdump", "-i", "any", "-w", "/pcaps/fox-%Y%m%d-%H%M.pcap", "-G", "600", "tcp port 8210 or tcp port 11434"]
    restart: "no"
