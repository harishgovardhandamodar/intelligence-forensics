services:
  # Access (no auth — tailnet/LAN only, do NOT publish to the internet):
  #   Tailscale: http://100.101.3.115:8211  (this host = axiom)
  #   LAN:       http://192.168.1.173:8211
  # From any other tailnet/LAN device, verify with:
  #   curl http://100.101.3.115:8211/health
  # If that times out, host ufw is filtering inbound — allow it once:
  #   sudo ufw allow 8211/tcp
  # HTTPS alternative (needs sudo once): sudo tailscale set --operator=$USER,
  # then: tailscale serve --bg http://127.0.0.1:8211
  intel-forensics:
    build: .
    container_name: intel-forensics
    hostname: intel-forensics
    restart: unless-stopped
    # Same reason as the swarm workers: everything the dashboard writes
    # (reports, runs, ledger, registry) must stay host-writable.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8211:8211"
    environment:
      # Reach host-side fox-services + Ollama from inside the container.
      - FOX_URL=http://host.docker.internal:8210
      - OLLAMA_URL=http://host.docker.internal:11434
      - IF_MODEL=${IF_MODEL:-qwen3.8:27b}
      - FOX_SERVICES_DB=/fox-data/fox_services.db
      - WORKSPACE_DIR=/workspace
    volumes:
      # Fox telemetry DB, read-only: we snapshot-copy it, never write.
      - /home/fox/codebase/fox-services/data:/fox-data:ro
      # Host workspace, read-only: the workspace security scope scans this
      # tree (never the container rootfs). Same ro posture as fox-data.
      - /home/fox/codebase:/workspace:ro
      # Persist our own evidence + reconstructions on the host repo.
      - ./evidence:/app/evidence
      - ./reconstructions:/app/reconstructions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8211/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Agent-swarm workers (P7.32): one container per role, NVIDIA passthrough.
  # Start with: SWARM_ROLE=profiler docker compose --profile swarm up -d
  # Scale with:  docker compose --profile swarm up -d --scale swarm-worker=2
  # Roles: profiler | critic | gather | security | any ($SWARM_ROLE).
  # Gatherers read fox telemetry (fox-data:ro); all other roles are confined
  # to ./evidence (they only ever see what gatherers collected). GPU count 1
  # per worker spreads replicas across both RTX 5080s; pin with device_ids.
  swarm-worker:
    profiles: [swarm]
    build: .
    # Run as the host user: worker-created files (queue results, ledger
    # entries) must stay writable by host-side processes sharing ./evidence.
    # Root-owned files on this volume previously broke host ledger appends.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - FOX_URL=http://host.docker.internal:8210
      - OLLAMA_URL=http://host.docker.internal:11434
      - IF_MODEL=${IF_MODEL:-qwen3.8:27b}
      - SWARM_ROLE=${SWARM_ROLE:-profiler}
    volumes:
      - ./evidence:/app/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["python", "cli.py", "swarm-worker"]
    healthcheck:
      disable: true
    restart: unless-stopped

  # Gatherer role: same worker, plus the read-only fox DB (P7.32).
  # Start with: SWARM_ROLE=gather docker compose --profile swarm up -d swarm-gather
  swarm-gather:
    profiles: [swarm]
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - FOX_URL=http://host.docker.internal:8210
      - OLLAMA_URL=http://host.docker.internal:11434
      - IF_MODEL=${IF_MODEL:-qwen3.8:27b}
      - SWARM_ROLE=gather
      - FOX_SERVICES_DB=/fox-data/fox_services.db
    volumes:
      - /home/fox/codebase/fox-services/data:/fox-data:ro
      - ./evidence:/app/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "cli.py", "swarm-worker", "--role", "gather"]
    healthcheck:
      disable: true
    restart: unless-stopped

  # Optional PORT-LEVEL capture (raw packets, not just fox APIs).
  # Off by default: start with `docker compose --profile pcap up -d pcap-tap`.
  # Needs no host root beyond docker access. WARNING: pcaps contain RAW
  # prompts (unmasked, unlike the fox DB) — treat ./evidence/pcaps as
  # sensitive, never commit, never ship off-host.
  pcap-tap:
    profiles: [pcap]
    image: nicolaka/netshoot:latest
    container_name: intel-pcap-tap
    network_mode: host
    cap_add:
      - NET_RAW
    volumes:
      - ./evidence/pcaps:/pcaps:rw
    command: ["tcpdump", "-i", "any", "-w", "/pcaps/fox-%Y%m%d-%H%M.pcap", "-G", "600", "tcp port 8210 or tcp port 11434"]
    restart: "no"

  # Optional Milvus vector DB for the reconstruction sim (P8).
  # Off by default: docker compose --profile milvus up -d.
  # The sim engine uses it only when MILVUS_URL is set AND reachable;
  # otherwise it degrades to the in-process numpy store (same API).
  milvus-etcd:
    profiles: [milvus]
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  milvus-minio:
    profiles: [milvus]
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-minio:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus-standalone:
    profiles: [milvus]
    image: milvusdb/milvus:v2.3.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio

volumes:
  milvus-etcd:
  milvus-minio:
  milvus-data:
